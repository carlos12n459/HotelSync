version: "3.8"

# Infraestructura completa de HotelSync con PostgreSQL, RabbitMQ y Redis.
# Con Docker Desktop instalado, ejecuta:
#   docker compose up --build
# y tendras todos los microservicios + infraestructura funcionando.

services:
  postgres:
    image: postgres:15
    container_name: hotelsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelsync_app
      POSTGRES_PASSWORD: hotelsync_app_pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - hotelsync_postgres_data:/var/lib/postgresql/data
      - ./infraestructura/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hotelsync-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hotelsync
      RABBITMQ_DEFAULT_PASS: hotelsync_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: hotelsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  servicio-disponibilidad-tarifas:
    build: ./servicio-disponibilidad-tarifas
    container_name: hotelsync-disponibilidad-tarifas
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: disponibilidad_tarifas_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
      URL_SERVICIO_PROPIEDADES: http://servicio-propiedades:3005
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  servicio-reservas:
    build: ./servicio-reservas
    container_name: hotelsync-reservas
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: reservas_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      URL_SERVICIO_DISPONIBILIDAD: http://servicio-disponibilidad-tarifas:3001
      URL_SERVICIO_PROPIEDADES: http://servicio-propiedades:3005
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-disponibilidad-tarifas:
        condition: service_started

  servicio-recepcion:
    build: ./servicio-recepcion
    container_name: hotelsync-recepcion
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: recepcion_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
      URL_SERVICIO_HOUSEKEEPING: http://servicio-housekeeping:3004
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-reservas:
        condition: service_started
      servicio-housekeeping:
        condition: service_started

  servicio-housekeeping:
    build: ./servicio-housekeeping
    container_name: hotelsync-housekeeping
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: housekeeping_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      URL_SERVICIO_RECEPCION: http://servicio-recepcion:3003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  servicio-propiedades:
    build: ./servicio-propiedades
    container_name: hotelsync-propiedades
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: propiedades_db
    depends_on:
      postgres:
        condition: service_healthy
      servicio-usuarios:
        condition: service_started

  servicio-channel-manager:
    build: ./servicio-channel-manager
    container_name: hotelsync-channel-manager
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: channel_manager_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
      URL_SERVICIO_DISPONIBILIDAD: http://servicio-disponibilidad-tarifas:3001
      URL_SERVICIO_PROPIEDADES: http://servicio-propiedades:3005
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-reservas:
        condition: service_started
      servicio-disponibilidad-tarifas:
        condition: service_started

  servicio-facturacion:
    build: ./servicio-facturacion
    container_name: hotelsync-facturacion
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: facturacion_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
      URL_SERVICIO_RECEPCION: http://servicio-recepcion:3003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-reservas:
        condition: service_started
      servicio-recepcion:
        condition: service_started

  servicio-fidelizacion:
    build: ./servicio-fidelizacion
    container_name: hotelsync-fidelizacion
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: fidelizacion_db
      RABBITMQ_URL: amqp://hotelsync:hotelsync_pass@rabbitmq:5672
      URL_SERVICIO_RECEPCION: http://servicio-recepcion:3003
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-recepcion:
        condition: service_started

  servicio-analytics:
    build: ./servicio-analytics
    container_name: hotelsync-analytics
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: analytics_db
      URL_SERVICIO_DISPONIBILIDAD: http://servicio-disponibilidad-tarifas:3001
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
      URL_SERVICIO_PROPIEDADES: http://servicio-propiedades:3005
    depends_on:
      postgres:
        condition: service_healthy
      servicio-disponibilidad-tarifas:
        condition: service_started
      servicio-reservas:
        condition: service_started
      servicio-propiedades:
        condition: service_started

  # Nuevo servicio de usuarios: autenticacion y autorizacion.
  servicio-usuarios:
    build: ./servicio-usuarios
    container_name: hotelsync-usuarios
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotelsync_app
      DB_PASSWORD: hotelsync_app_pass
      DB_NAME: usuarios_db
      JWT_SECRET: ${JWT_SECRET:-hotelsync_jwt_secret_para_dev}
      JWT_EXPIRES_IN: 24h
      BCRYPT_ROUNDS: 10
    depends_on:
      postgres:
        condition: service_healthy

  # Nuevo servicio de archivos: subida y servicio de imagenes.
  servicio-archivos:
    build: ./servicio-archivos
    container_name: hotelsync-archivos
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      PORT: 3012
      UPLOAD_DIR: uploads
    volumes:
      - hotelsync_uploads:/app/uploads
    depends_on:
      - servicio-usuarios

  api-gateway:
    build: ./api-gateway
    container_name: hotelsync-api-gateway
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      URL_SERVICIO_DISPONIBILIDAD: http://servicio-disponibilidad-tarifas:3001
      URL_SERVICIO_RESERVAS: http://servicio-reservas:3002
      URL_SERVICIO_RECEPCION: http://servicio-recepcion:3003
      URL_SERVICIO_HOUSEKEEPING: http://servicio-housekeeping:3004
      URL_SERVICIO_PROPIEDADES: http://servicio-propiedades:3005
      URL_SERVICIO_CHANNEL_MANAGER: http://servicio-channel-manager:3006
      URL_SERVICIO_FACTURACION: http://servicio-facturacion:3007
      URL_SERVICIO_FIDELIZACION: http://servicio-fidelizacion:3008
      URL_SERVICIO_ANALYTICS: http://servicio-analytics:3009
      URL_SERVICIO_USUARIOS: http://servicio-usuarios:3011
      URL_SERVICIO_ARCHIVOS: http://servicio-archivos:3012
      JWT_SECRET: ${JWT_SECRET:-hotelsync_jwt_secret_para_dev}
    depends_on:
      - servicio-disponibilidad-tarifas
      - servicio-reservas
      - servicio-recepcion
      - servicio-housekeeping
      - servicio-propiedades
      - servicio-channel-manager
      - servicio-facturacion
      - servicio-fidelizacion
      - servicio-analytics
      - servicio-usuarios
      - servicio-archivos

volumes:
  hotelsync_postgres_data:
  hotelsync_uploads:
