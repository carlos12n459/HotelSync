<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HotelSync — Iniciar sesion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-box">
    <div class="brand" style="margin-bottom:18px;">
      <div class="brand-icon" style="width:36px;height:36px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div>
        <div class="brand-name">HotelSync</div>
      </div>
    </div>

    <h1 id="authTitle">Iniciar sesion</h1>
    <p id="authSubtitle">Ingresa tus credenciales para continuar</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="mostrarLogin()">Login</button>
      <button class="tab" id="tabRegister" onclick="mostrarRegister()">Registro</button>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="field" style="margin-bottom:14px;">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="admin@hotelsync.com" />
      </div>
      <div class="field" style="margin-bottom:18px;">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="admin123" />
      </div>
      <button class="btn" style="width:100%;">Ingresar</button>
    </form>

    <form id="registerForm" class="hidden" onsubmit="return handleRegister(event)">
      <div class="field" style="margin-bottom:14px;">
        <label>Nombre completo</label>
        <input type="text" id="reg-nombre" required />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Email</label>
        <input type="email" id="reg-email" required />
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Password</label>
        <input type="password" id="reg-password" required minlength="6" />
      </div>
      <div class="field" style="margin-bottom:18px;">
        <label>Rol</label>
        <select id="reg-rol">
          <option value="huesped">Huesped</option>
          <option value="anfitrion">Anfitrion</option>
          <option value="empleado">Empleado</option>
        </select>
      </div>
      <button class="btn" style="width:100%;">Crear cuenta</button>
    </form>

    <div class="auth-links">
      <a href="index.html">Volver al inicio</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg">Mensaje</span></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // Si ya hay sesion, redirigir al dashboard correspondiente.
  manejarAuthRedirect();

  function mostrarLogin(){
    $("loginForm").classList.remove("hidden");
    $("registerForm").classList.add("hidden");
    $("tabLogin").classList.add("active");
    $("tabRegister").classList.remove("active");
    $("authTitle").textContent = "Iniciar sesion";
    $("authSubtitle").textContent = "Ingresa tus credenciales para continuar";
  }

  function mostrarRegister(){
    $("loginForm").classList.add("hidden");
    $("registerForm").classList.remove("hidden");
    $("tabLogin").classList.remove("active");
    $("tabRegister").classList.add("active");
    $("authTitle").textContent = "Crear cuenta";
    $("authSubtitle").textContent = "Registrate para reservar o publicar hoteles";
  }

  async function handleLogin(e){
    e.preventDefault();
    const email = $("login-email").value;
    const password = $("login-password").value;
    try {
      const usuario = await iniciarSesion(email, password);
      mostrarToast("Bienvenido, " + usuario.nombre, "success");
      setTimeout(() => redirigirPorRol(usuario.rol), 800);
    } catch(error){
      mostrarToast(error.message, "error");
    }
    return false;
  }

  async function handleRegister(e){
    e.preventDefault();
    const nombre = $("reg-nombre").value;
    const email = $("reg-email").value;
    const password = $("reg-password").value;
    const rol = $("reg-rol").value;
    try {
      const usuario = await registrarUsuario(nombre, email, password, rol);
      mostrarToast("Cuenta creada. Bienvenido, " + usuario.nombre, "success");
      setTimeout(() => redirigirPorRol(usuario.rol), 800);
    } catch(error){
      mostrarToast(error.message, "error");
    }
    return false;
  }
</script>
</body>
</html>
