<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HotelSync — Panel del cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </div>
    <div>
      <div class="brand-name">HotelSync</div>
      <div class="brand-sub">Panel del cliente</div>
    </div>
  </a>
  <div class="topbar-actions">
    <div class="nav-links">
      <a href="dashboard.html">Buscar</a>
      <a href="reservas.html">Mis reservas</a>
    </div>
    <div class="user-pill" id="userPill"></div>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="logout()">Salir</button>
  </div>
</div>

<header class="page-header">
  <div class="page-header-inner">
    <h1>Encuentra tu proxima estadia</h1>
    <p>Busca entre los mejores hoteles y reserva en segundos.</p>
  </div>
</header>

<main class="container" style="padding-top:56px;">

  <!-- Carrusel destacado -->
  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      </div>
      <div class="section-title">
        <h2>Hoteles destacados</h2>
        <p>Las mejores opciones seleccionadas para ti</p>
      </div>
    </div>

    <div class="carousel" id="carousel-destacados">
      <div class="carousel-track" id="carousel-track"></div>
      <button class="carousel-btn prev" onclick="moverCarousel(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="carousel-btn next" onclick="moverCarousel(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <div class="carousel-dots" id="carousel-dots"></div>
    </div>
  </div>

  <!-- Busqueda con filtros -->
  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
      <div class="section-title">
        <h2>Buscar hoteles</h2>
        <p>Filtra por ciudad, precio, categoria y mas</p>
      </div>
    </div>

    <div class="layout-split">
      <!-- Filtros colapsables -->
      <aside class="filter-panel">
        <div class="filter-group open" id="fg-ciudad">
          <button class="filter-header" onclick="toggleFilter('fg-ciudad')">
            <span class="filter-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              Ciudad
            </span>
            <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-content">
            <div class="field">
              <input type="text" id="buscar-ciudad" placeholder="Ej: Bogota, Cartagena" />
            </div>
          </div>
        </div>

        <div class="filter-group open" id="fg-precio">
          <button class="filter-header" onclick="toggleFilter('fg-precio')">
            <span class="filter-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
              Precio por noche
            </span>
            <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-content">
            <div class="filter-price">
              <div class="field">
                <label>Min</label>
                <input type="number" id="precio-min" value="0" min="0" />
              </div>
              <span style="color:var(--slate-400);padding-top:22px;">-</span>
              <div class="field">
                <label>Max</label>
                <input type="number" id="precio-max" value="1000000" min="0" />
              </div>
            </div>
            <input type="range" class="filter-slider" id="precio-slider" min="0" max="1000000" step="50000" value="1000000" />
          </div>
        </div>

        <div class="filter-group" id="fg-rating">
          <button class="filter-header" onclick="toggleFilter('fg-rating')">
            <span class="filter-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              Calificacion
            </span>
            <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-content">
            <div class="rating" id="filtro-rating">
              <svg data-value="1" viewBox="0 0 24 24" fill="currentColor" stroke="none" onclick="setRating(1)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <svg data-value="2" viewBox="0 0 24 24" fill="currentColor" stroke="none" onclick="setRating(2)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <svg data-value="3" viewBox="0 0 24 24" fill="currentColor" stroke="none" onclick="setRating(3)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <svg data-value="4" viewBox="0 0 24 24" fill="currentColor" stroke="none" onclick="setRating(4)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <svg data-value="5" viewBox="0 0 24 24" fill="currentColor" stroke="none" onclick="setRating(5)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </div>
            <input type="hidden" id="rating-value" value="0" />
          </div>
        </div>

        <div class="filter-group" id="fg-categoria">
          <button class="filter-header" onclick="toggleFilter('fg-categoria')">
            <span class="filter-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
              Categoria
            </span>
            <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-content">
            <label class="filter-option"><input type="checkbox" value="estandar" /> Estandar</label>
            <label class="filter-option"><input type="checkbox" value="suite" /> Suite</label>
            <label class="filter-option"><input type="checkbox" value="deluxe" /> Deluxe</label>
            <label class="filter-option"><input type="checkbox" value="familiar" /> Familiar</label>
          </div>
        </div>

        <div style="margin-top:16px;">
          <button class="btn" style="width:100%;" onclick="buscarHoteles()">Aplicar filtros</button>
          <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="limpiarBusqueda()">Limpiar</button>
        </div>
      </aside>

      <!-- Resultados -->
      <div>
        <div class="section" style="margin-bottom:18px;padding:18px 22px;">
          <div class="grid-3" style="align-items:end;">
            <div class="field"><label>Check-in</label><input type="date" id="buscar-in" /></div>
            <div class="field"><label>Check-out</label><input type="date" id="buscar-out" /></div>
            <button class="btn" onclick="buscarHoteles()">Buscar</button>
          </div>
        </div>

        <div id="resultados-hoteles" class="card-grid"></div>
      </div>
    </div>
  </div>

</main>

<!-- Modal de reserva -->
<div id="modalReserva" class="hidden" style="position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:18px;padding:28px;max-width:480px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);">
    <h2 style="margin-bottom:16px;">Crear reserva</h2>
    <div class="grid-2">
      <div class="field"><label>Nombre cliente</label><input type="text" id="res-nombre" /></div>
      <div class="field"><label>Email cliente</label><input type="email" id="res-email" /></div>
      <div class="field"><label>Check-in</label><input type="date" id="res-in" /></div>
      <div class="field"><label>Check-out</label><input type="date" id="res-out" /></div>
      <div class="field" style="grid-column:1 / -1;"><label>Tipo de habitacion</label><select id="res-tipo"></select></div>
      <div class="field"><label>Monto total</label><input type="number" id="res-monto" /></div>
      <div class="field"><label>Noches</label><input type="text" id="res-noches" readonly style="background:var(--slate-50);" /></div>
    </div>
    <input type="hidden" id="res-hotel" />
    <div class="btn-group" style="margin-top:20px;justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-success" onclick="crearReserva()">Confirmar reserva</button>
    </div>
    <div id="res-resultado" class="result hidden"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg">Mensaje</span></div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  protegerRol(["cliente"]);
  renderizarUsuario();

  let hotelesCache = [];
  let tiposCache = [];
  let carouselIndex = 0;

  document.addEventListener("DOMContentLoaded", () => {
    inicializarFechas("buscar-in", "buscar-out");
    const usuario = obtenerUsuario();
    if(usuario){
      document.getElementById("res-nombre").value = usuario.nombre;
      document.getElementById("res-email").value = usuario.email;
    }
    cargarDestacados();
    buscarHoteles();

    document.getElementById("precio-slider").addEventListener("input", (e) => {
      document.getElementById("precio-max").value = e.target.value;
    });

    document.getElementById("res-tipo").addEventListener("change", calcularMonto);
    document.getElementById("res-in").addEventListener("change", calcularMonto);
    document.getElementById("res-out").addEventListener("change", calcularMonto);
  });

  async function cargarDestacados(){
    try {
      const hoteles = await apiListarHoteles();
      const destacados = hoteles.slice(0, 5);
      renderCarousel(destacados);
    } catch(error){
      console.error("Error cargando destacados", error);
    }
  }

  function renderCarousel(hoteles){
    const track = document.getElementById("carousel-track");
    const dots = document.getElementById("carousel-dots");
    if(!track || hoteles.length === 0) return;

    track.innerHTML = hoteles.map((h, i) => `
      <div class="carousel-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
        <img src="${h.imagen_url ? API_BASE + h.imagen_url : 'https://www.fffuel.co/images/dddepth-preview/dddepth-248.jpg'}" alt="${h.nombre}" />
        <div class="slide-caption">
          <h3>${h.nombre}</h3>
          <p>${h.ciudad}, ${h.pais}</p>
        </div>
      </div>
    `).join("");

    dots.innerHTML = hoteles.map((_, i) => `
      <button class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="irCarousel(${i})"></button>
    `).join("");

    actualizarCarousel();
  }

  function actualizarCarousel(){
    const track = document.getElementById("carousel-track");
    const slides = track.querySelectorAll(".carousel-slide");
    if(slides.length === 0) return;

    slides.forEach((s, i) => {
      s.classList.toggle("active", i === carouselIndex);
    });

    const slideWidth = slides[0].offsetWidth;
    track.style.transform = `translateX(calc(20% - ${carouselIndex * slideWidth}px))`;

    document.querySelectorAll(".carousel-dot").forEach((d, i) => {
      d.classList.toggle("active", i === carouselIndex);
    });
  }

  function moverCarousel(dir){
    const slides = document.querySelectorAll(".carousel-slide");
    if(slides.length === 0) return;
    carouselIndex = (carouselIndex + dir + slides.length) % slides.length;
    actualizarCarousel();
  }

  function irCarousel(index){
    carouselIndex = index;
    actualizarCarousel();
  }

  setInterval(() => {
    const slides = document.querySelectorAll(".carousel-slide");
    if(slides.length > 1) moverCarousel(1);
  }, 5000);

  function toggleFilter(id){
    document.getElementById(id).classList.toggle("open");
  }

  function setRating(value){
    const input = document.getElementById("rating-value");
    input.value = input.value == value ? 0 : value;
    document.querySelectorAll("#filtro-rating svg").forEach(s => {
      const v = parseInt(s.dataset.value);
      s.classList.toggle("filled", v <= input.value);
    });
  }

  async function buscarHoteles(){
    const contenedor = document.getElementById("resultados-hoteles");
    contenedor.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="spinner spinner-lg"></div><span>Buscando hoteles...</span></div>`;
    const ciudad = document.getElementById("buscar-ciudad").value.toLowerCase();

    try {
      hotelesCache = await apiListarHoteles();
      let filtrados = ciudad ? hotelesCache.filter(h => h.ciudad.toLowerCase().includes(ciudad)) : hotelesCache;

      if(filtrados.length === 0){
        contenedor.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h3>No se encontraron hoteles</h3>
            <p>Prueba con otra ciudad o ajusta los filtros.</p>
          </div>`;
        return;
      }

      contenedor.innerHTML = filtrados.map(h => `
        <div class="card">
          <div class="card-img">
            ${h.imagen_url ? `<img src="${API_BASE}${h.imagen_url}" alt="${h.nombre}" onerror="this.style.display='none'" />` : "Sin imagen"}
          </div>
          <div class="card-body">
            <div class="card-title">${h.nombre}</div>
            <div class="card-text">${h.ciudad}, ${h.pais}</div>
            <div class="card-meta">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              ${h.direccion || "Direccion no disponible"}
            </div>
          </div>
          <div class="card-actions">
            <button class="btn" style="flex:1;" onclick="abrirModal(${h.id})">Reservar</button>
          </div>
        </div>
      `).join("");
    } catch(error){
      contenedor.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <h3>Error al buscar</h3>
          <p>${error.message}</p>
        </div>`;
    }
  }

  function limpiarBusqueda(){
    document.getElementById("buscar-ciudad").value = "";
    document.getElementById("precio-min").value = 0;
    document.getElementById("precio-max").value = 1000000;
    document.getElementById("precio-slider").value = 1000000;
    document.getElementById("rating-value").value = 0;
    document.querySelectorAll("#filtro-rating svg").forEach(s => s.classList.remove("filled"));
    document.querySelectorAll(".filter-option input").forEach(c => c.checked = false);
    buscarHoteles();
  }

  async function abrirModal(hotelId){
    const hotel = hotelesCache.find(h => h.id === hotelId);
    if(!hotel) return;

    document.getElementById("res-hotel").value = hotelId;
    document.getElementById("res-resultado").classList.add("hidden");

    const select = document.getElementById("res-tipo");
    select.innerHTML = "<option value=''>Cargando...</option>";
    try {
      tiposCache = await apiListarTiposHabitacion(hotelId);
      select.innerHTML = tiposCache.map(t => `<option value="${t.id}" data-tarifa="${t.tarifa_base}">${t.nombre} - ${formatearPrecio(t.tarifa_base)}</option>`).join("");
      calcularMonto();
    } catch(error){
      mostrarToast(error.message, "error");
    }

    document.getElementById("modalReserva").classList.remove("hidden");
  }

  function cerrarModal(){
    document.getElementById("modalReserva").classList.add("hidden");
  }

  function calcularMonto(){
    const tipoId = Number(document.getElementById("res-tipo").value);
    const tipo = tiposCache.find(t => t.id === tipoId);
    const entrada = new Date(document.getElementById("res-in").value);
    const salida = new Date(document.getElementById("res-out").value);
    if(!tipo || isNaN(entrada) || isNaN(salida) || salida <= entrada){
      document.getElementById("res-monto").value = "";
      document.getElementById("res-noches").value = "";
      return;
    }
    const noches = Math.ceil((salida - entrada) / (1000 * 60 * 60 * 24));
    document.getElementById("res-monto").value = tipo.tarifa_base * noches;
    document.getElementById("res-noches").value = `${noches} noche${noches > 1 ? 's' : ''}`;
  }

  async function crearReserva(){
    const body = {
      hotel_id: Number(document.getElementById("res-hotel").value),
      tipo_habitacion_id: Number(document.getElementById("res-tipo").value),
      nombre_huesped: document.getElementById("res-nombre").value,
      email_huesped: document.getElementById("res-email").value,
      fecha_checkin: document.getElementById("res-in").value,
      fecha_checkout: document.getElementById("res-out").value,
      monto_total: Number(document.getElementById("res-monto").value),
      canal: "directo"
    };

    renderLoading("res-resultado", "Procesando...");

    try {
      const resp = await apiCrearReserva(body);
      renderData("res-resultado", resp);
      mostrarToast("Reserva creada con exito", "success");
      setTimeout(cerrarModal, 1200);
    } catch(error){
      renderError("res-resultado", error.message);
    }
  }
</script>
</body>
</html>
