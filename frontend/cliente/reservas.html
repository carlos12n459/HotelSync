<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HotelSync — Mis reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </div>
    <div>
      <div class="brand-name">HotelSync</div>
      <div class="brand-sub">Panel del cliente</div>
    </div>
  </a>
  <div class="topbar-actions">
    <div class="nav-links">
      <a href="dashboard.html">Buscar</a>
      <a href="reservas.html">Mis reservas</a>
    </div>
    <div class="user-pill" id="userPill"></div>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="logout()">Salir</button>
  </div>
</div>

<header class="page-header">
  <div class="page-header-inner">
    <h1>Mis reservas</h1>
    <p>Revisa el historial y el estado de tus reservas.</p>
  </div>
</header>

<main class="container" style="padding-top:56px;">
  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Historial de reservas</h2>
        <p>Todas tus estadias confirmadas y pasadas</p>
      </div>
    </div>
    <div id="reservas-lista" class="card-grid"></div>
  </div>
</main>

<div class="toast" id="toast"><span id="toastMsg">Mensaje</span></div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  protegerRol(["cliente"]);
  renderizarUsuario();

  document.addEventListener("DOMContentLoaded", cargarReservas);

  async function cargarReservas(){
    const contenedor = $("reservas-lista");
    contenedor.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="spinner spinner-lg"></div><span>Cargando reservas...</span></div>`;

    try {
      const reservas = await apiMisReservas();
      if(reservas.length === 0){
        contenedor.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <h3>Aun no tienes reservas</h3>
            <p><a href="dashboard.html" style="color:var(--sky-700);font-weight:600;">Busca un hotel</a> y reserva tu primera estadia.</p>
          </div>`;
        return;
      }

      contenedor.innerHTML = reservas.map(r => `
        <div class="card">
          <div class="card-body">
            <div class="card-title">Reserva #${r.id}</div>
            <div class="card-text">Hotel ID: ${r.hotel_id}</div>
            <div class="card-text">Entrada: ${formatearFecha(r.fecha_checkin)} — Salida: ${formatearFecha(r.fecha_checkout)}</div>
            <div class="card-text">Total: ${formatearPrecio(r.monto_total)}</div>
            <div class="card-meta">
              <span class="badge ${r.estado === 'confirmada' ? 'badge-ok' : (r.estado === 'cancelada' ? 'badge-warn' : 'badge-info')}">${r.estado}</span>
            </div>
          </div>
          <div class="card-actions">
            ${r.estado === "confirmada" ? `<button class="btn btn-danger" style="flex:1;" onclick="cancelarReserva(${r.id})">Cancelar</button>` : ""}
          </div>
        </div>
      `).join("");
    } catch(error){
      contenedor.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <h3>Error al cargar</h3>
          <p>${error.message}</p>
        </div>`;
    }
  }

  async function cancelarReserva(id){
    if(!confirm("¿Seguro que deseas cancelar esta reserva?")) return;
    try {
      await apiCancelarReserva(id);
      mostrarToast("Reserva cancelada", "success");
      cargarReservas();
    } catch(error){
      mostrarToast(error.message, "error");
    }
  }
</script>
</body>
</html>
