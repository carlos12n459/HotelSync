<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HotelSync — Gestionar habitaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </div>
    <div>
      <div class="brand-name">HotelSync</div>
      <div class="brand-sub">Panel del gerente</div>
    </div>
  </a>
  <div class="topbar-actions">
    <div class="nav-links">
      <a href="dashboard.html">Mis hoteles</a>
      <a href="hoteles.html">Gestionar hoteles</a>
      <a href="habitaciones.html">Habitaciones</a>
    </div>
    <div class="user-pill" id="userPill"></div>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="logout()">Salir</button>
  </div>
</div>

<main class="container">

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Gestionar habitaciones</h2>
        <p>Selecciona un hotel para agregar tipos de habitacion y habitaciones fisicas</p>
      </div>
    </div>
    <div class="field" style="margin-bottom:18px;">
      <label>Hotel</label>
      <select id="select-hotel" onchange="cambiarHotel()"></select>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div class="section-title">
        <h2>Agregar tipo de habitacion</h2>
      </div>
    </div>
    <form id="tipoForm" onsubmit="return crearTipo(event)">
      <div class="grid-3">
        <div class="field"><label>Nombre</label><input type="text" id="t-nombre" required /></div>
        <div class="field"><label>Capacidad</label><input type="number" id="t-capacidad" value="2" required /></div>
        <div class="field"><label>Tarifa base</label><input type="number" id="t-tarifa" required /></div>
        <div class="field" style="grid-column:1 / -1;">
          <label>Imagen</label>
          <input type="file" id="t-imagen" accept="image/*" />
        </div>
      </div>
      <div class="btn-group" style="margin-top:16px;">
        <button class="btn btn-success" type="submit">Agregar tipo</button>
      </div>
    </form>
    <div id="tipo-resultado" class="result hidden"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div class="section-title">
        <h2>Agregar habitacion fisica</h2>
      </div>
    </div>
    <form id="habForm" onsubmit="return crearHabitacion(event)">
      <div class="grid-3">
        <div class="field"><label>Numero</label><input type="text" id="hab-numero" required /></div>
        <div class="field"><label>Tipo de habitacion</label><select id="hab-tipo" required></select></div>
        <div class="field"><label>Piso</label><input type="text" id="hab-piso" /></div>
      </div>
      <div class="btn-group" style="margin-top:16px;">
        <button class="btn btn-success" type="submit">Agregar habitacion</button>
      </div>
    </form>
    <div id="hab-resultado" class="result hidden"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Tipos de habitacion</h2>
      </div>
    </div>
    <div id="tipos-lista" class="card-grid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Habitaciones fisicas</h2>
      </div>
    </div>
    <div id="habitaciones-lista" class="card-grid"></div>
  </div>

</main>

<div class="toast" id="toast"><span id="toastMsg">Mensaje</span></div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  protegerRol(["admin", "gerente"]);
  renderizarUsuario();

  let hotelesCache = [];
  let hotelIdActual = null;

  document.addEventListener("DOMContentLoaded", async () => {
    await cargarHoteles();
    const params = new URLSearchParams(location.search);
    const hotelIdParam = params.get("hotel_id");
    if(hotelIdParam){
      $("select-hotel").value = hotelIdParam;
    }
    cambiarHotel();
  });

  async function cargarHoteles(){
    const select = $("select-hotel");
    select.innerHTML = "<option value=''>Cargando...</option>";
    try {
      hotelesCache = await apiListarHotelesMios();
      select.innerHTML = hotelesCache.map(h => `<option value="${h.id}">${h.nombre} - ${h.ciudad}</option>`).join("");
    } catch(error){
      mostrarToast(error.message, "error");
    }
  }

  async function cambiarHotel(){
    hotelIdActual = Number($("select-hotel").value);
    if(!hotelIdActual) return;
    await cargarTipos();
    await cargarHabitaciones();
  }

  async function cargarTipos(){
    const select = $("hab-tipo");
    renderLoading("tipos-lista", "Cargando...", { setClass: false });

    try {
      const tipos = await apiListarTiposHabitacion(hotelIdActual);
      select.innerHTML = tipos.map(t => `<option value="${t.id}">${t.nombre}</option>`).join("");

      renderData("tipos-lista", tipos, {
        setClass: false,
        emptyMessage: "No hay tipos de habitacion."
      });
    } catch(error){
      renderError("tipos-lista", error.message, { setClass: false });
    }
  }

  async function cargarHabitaciones(){
    renderLoading("habitaciones-lista", "Cargando...", { setClass: false });

    try {
      const habitaciones = await apiListarHabitaciones(hotelIdActual);
      renderData("habitaciones-lista", habitaciones, {
        setClass: false,
        emptyMessage: "No hay habitaciones fisicas."
      });
    } catch(error){
      renderError("habitaciones-lista", error.message, { setClass: false });
    }
  }

  async function crearTipo(e){
    e.preventDefault();
    renderLoading("tipo-resultado", "Subiendo imagen...");

    let imagenUrl = "";
    const archivo = $("t-imagen").files[0];

    try {
      if(archivo){
        const formData = new FormData();
        formData.append("archivo", archivo);
        const uploadResp = await apiSubirArchivo(formData);
        imagenUrl = uploadResp.url;
      }

      const body = {
        nombre: $("t-nombre").value,
        capacidad: Number($("t-capacidad").value),
        tarifa_base: Number($("t-tarifa").value),
        imagen_url: imagenUrl
      };

      const resp = await apiCrearTipoHabitacion(hotelIdActual, body);
      renderData("tipo-resultado", resp);
      $("tipoForm").reset();
      cargarTipos();
    } catch(error){
      renderError("tipo-resultado", error.message);
      mostrarToast(error.message, "error");
    }
    return false;
  }

  async function crearHabitacion(e){
    e.preventDefault();
    renderLoading("hab-resultado", "Guardando...");

    try {
      const body = {
        numero: $("hab-numero").value,
        tipo_habitacion_id: Number($("hab-tipo").value),
        piso: $("hab-piso").value
      };

      const resp = await apiCrearHabitacion(hotelIdActual, body);
      renderData("hab-resultado", resp);
      $("habForm").reset();
      cargarHabitaciones();
    } catch(error){
      renderError("hab-resultado", error.message);
      mostrarToast(error.message, "error");
    }
    return false;
  }
</script>
</body>
</html>
