<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HotelSync — Gestionar habitaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </div>
    <div>
      <div class="brand-name">HotelSync</div>
      <div class="brand-sub">Panel del gerente</div>
    </div>
  </a>
  <div class="topbar-actions">
    <div class="nav-links">
      <a href="dashboard.html">Mis hoteles</a>
      <a href="hoteles.html">Gestionar hoteles</a>
      <a href="habitaciones.html">Habitaciones</a>
    </div>
    <div class="user-pill" id="userPill"></div>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="logout()">Salir</button>
  </div>
</div>

<header class="page-header">
  <div class="page-header-inner">
    <h1>Gestionar habitaciones</h1>
    <p>Selecciona un hotel para agregar tipos de habitacion y habitaciones fisicas.</p>
  </div>
</header>

<main class="container" style="padding-top:56px;">

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Hotel seleccionado</h2>
      </div>
    </div>
    <div class="field" style="max-width:420px;">
      <label>Hotel</label>
      <select id="select-hotel" onchange="cambiarHotel()"></select>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div class="section-title">
        <h2>Agregar tipo de habitacion</h2>
      </div>
    </div>
    <form id="tipoForm" onsubmit="return crearTipo(event)">
      <div class="grid-3">
        <div class="field"><label>Nombre</label><input type="text" id="t-nombre" required /></div>
        <div class="field"><label>Capacidad</label><input type="number" id="t-capacidad" value="2" required /></div>
        <div class="field"><label>Tarifa base</label><input type="number" id="t-tarifa" required /></div>
        <div class="field" style="grid-column:1 / -1;">
          <label>Imagen</label>
          <input type="file" id="t-imagen" accept="image/*" />
        </div>
      </div>
      <div class="btn-group" style="margin-top:16px;">
        <button class="btn btn-success" type="submit" id="btn-tipo">Agregar tipo</button>
      </div>
    </form>
    <div id="tipo-resultado" class="result hidden"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div class="section-title">
        <h2>Agregar habitacion fisica</h2>
      </div>
    </div>
    <form id="habForm" onsubmit="return crearHabitacion(event)">
      <div class="grid-3">
        <div class="field"><label>Numero</label><input type="text" id="hab-numero" required /></div>
        <div class="field"><label>Tipo de habitacion</label><select id="hab-tipo" required></select></div>
        <div class="field"><label>Piso</label><input type="text" id="hab-piso" /></div>
      </div>
      <div class="btn-group" style="margin-top:16px;">
        <button class="btn btn-success" type="submit" id="btn-hab">Agregar habitacion</button>
      </div>
    </form>
    <div id="hab-resultado" class="result hidden"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Tipos de habitacion</h2>
      </div>
    </div>
    <div id="tipos-lista" class="card-grid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Habitaciones fisicas</h2>
      </div>
    </div>
    <div id="habitaciones-lista" class="card-grid"></div>
  </div>

</main>

<div class="toast" id="toast"><span id="toastMsg">Mensaje</span></div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  protegerRol(["admin", "gerente"]);
  renderizarUsuario();

  let hotelesCache = [];
  let hotelIdActual = null;

  document.addEventListener("DOMContentLoaded", async () => {
    await cargarHoteles();
    const params = new URLSearchParams(location.search);
    const hotelIdParam = params.get("hotel_id");
    if(hotelIdParam){
      $("select-hotel").value = hotelIdParam;
    }
    cambiarHotel();
  });

  function setLoading(btn, loading){
    if(loading){
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner spinner-sm"></div><span>Guardando...</span>`;
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.getAttribute('data-text') || btn.textContent;
    }
  }

  document.querySelectorAll('button[type="submit"]').forEach(b => {
    if(!b.getAttribute('data-text')) b.setAttribute('data-text', b.textContent);
  });

  async function cargarHoteles(){
    const select = $("select-hotel");
    select.innerHTML = "<option value=''>Cargando...</option>";
    try {
      hotelesCache = await apiListarHotelesMios();
      select.innerHTML = hotelesCache.map(h => `<option value="${h.id}">${h.nombre} - ${h.ciudad}</option>`).join("");
    } catch(error){
      mostrarToast(error.message, "error");
    }
  }

  async function cambiarHotel(){
    hotelIdActual = Number($("select-hotel").value);
    if(!hotelIdActual) return;
    await cargarTipos();
    await cargarHabitaciones();
  }

  async function cargarTipos(){
    const select = $("hab-tipo");
    const contenedor = $("tipos-lista");
    contenedor.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="spinner spinner-lg"></div><span>Cargando tipos...</span></div>`;

    try {
      const tipos = await apiListarTiposHabitacion(hotelIdActual);
      select.innerHTML = tipos.map(t => `<option value="${t.id}">${t.nombre}</option>`).join("");

      if(tipos.length === 0){
        contenedor.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
            <h3>No hay tipos de habitacion</h3>
            <p>Agrega el primero usando el formulario de arriba.</p>
          </div>`;
        return;
      }

      contenedor.innerHTML = tipos.map(t => `
        <div class="card">
          <div class="card-img">
            ${t.imagen_url ? `<img src="${API_BASE}${t.imagen_url}" alt="${t.nombre}" onerror="this.style.display='none'" />` : "Sin imagen"}
          </div>
          <div class="card-body">
            <div class="card-title">${t.nombre}</div>
            <div class="card-text">Capacidad: ${t.capacidad} personas</div>
            <div class="card-text">Tarifa base: ${formatearPrecio(t.tarifa_base)}</div>
          </div>
        </div>
      `).join("");
    } catch(error){
      contenedor.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <h3>Error al cargar</h3>
          <p>${error.message}</p>
        </div>`;
    }
  }

  async function cargarHabitaciones(){
    const contenedor = $("habitaciones-lista");
    contenedor.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="spinner spinner-lg"></div><span>Cargando habitaciones...</span></div>`;

    try {
      const habitaciones = await apiListarHabitaciones(hotelIdActual);
      if(habitaciones.length === 0){
        contenedor.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <h3>No hay habitaciones fisicas</h3>
            <p>Agrega habitaciones al tipo seleccionado.</p>
          </div>`;
        return;
      }

      contenedor.innerHTML = habitaciones.map(h => `
        <div class="card">
          <div class="card-body">
            <div class="card-title">Habitacion ${h.numero}</div>
            <div class="card-text">Piso: ${h.piso || "N/A"}</div>
            <div class="card-meta">
              <span class="badge ${h.activa ? 'badge-ok' : 'badge-warn'}">${h.activa ? "Activa" : "Inactiva"}</span>
            </div>
          </div>
        </div>
      `).join("");
    } catch(error){
      contenedor.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <h3>Error al cargar</h3>
          <p>${error.message}</p>
        </div>`;
    }
  }

  async function crearTipo(e){
    e.preventDefault();
    const btn = $("btn-tipo");
    setLoading(btn, true);
    renderLoading("tipo-resultado", "Subiendo imagen...");

    let imagenUrl = "";
    const archivo = $("t-imagen").files[0];

    try {
      if(archivo){
        const formData = new FormData();
        formData.append("archivo", archivo);
        const uploadResp = await apiSubirArchivo(formData);
        imagenUrl = uploadResp.url;
      }

      const body = {
        nombre: $("t-nombre").value,
        capacidad: Number($("t-capacidad").value),
        tarifa_base: Number($("t-tarifa").value),
        imagen_url: imagenUrl
      };

      const resp = await apiCrearTipoHabitacion(hotelIdActual, body);
      renderData("tipo-resultado", resp);
      $("tipoForm").reset();
      cargarTipos();
      mostrarToast("Tipo de habitacion agregado", "success");
    } catch(error){
      renderError("tipo-resultado", error.message);
      mostrarToast(error.message, "error");
    } finally {
      setLoading(btn, false);
    }
    return false;
  }

  async function crearHabitacion(e){
    e.preventDefault();
    const btn = $("btn-hab");
    setLoading(btn, true);
    renderLoading("hab-resultado", "Guardando...");

    try {
      const body = {
        numero: $("hab-numero").value,
        tipo_habitacion_id: Number($("hab-tipo").value),
        piso: $("hab-piso").value
      };

      const resp = await apiCrearHabitacion(hotelIdActual, body);
      renderData("hab-resultado", resp);
      $("habForm").reset();
      cargarHabitaciones();
      mostrarToast("Habitacion agregada", "success");
    } catch(error){
      renderError("hab-resultado", error.message);
      mostrarToast(error.message, "error");
    } finally {
      setLoading(btn, false);
    }
    return false;
  }
</script>
</body>
</html>
