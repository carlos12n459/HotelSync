<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HotelSync — Panel de administracion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </div>
    <div>
      <div class="brand-name">HotelSync</div>
      <div class="brand-sub">Panel de administracion</div>
    </div>
  </a>
  <div class="topbar-actions">
    <div class="nav-links">
      <a href="dashboard.html">Admin</a>
    </div>
    <div class="user-pill" id="userPill"></div>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="logout()">Salir</button>
  </div>
</div>

<header class="page-header">
  <div class="page-header-inner">
    <h1>Administracion</h1>
    <p>Gestion de usuarios, propiedades y reservas del sistema.</p>
  </div>
</header>

<main class="container" style="padding-top:56px;">

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
      </div>
      <div class="section-title">
        <h2>Gestion de usuarios</h2>
        <p>Cambiar roles de los usuarios del sistema</p>
      </div>
    </div>
    <div class="grid-3">
      <div class="field"><label>ID del usuario</label><input type="number" id="usr-id" /></div>
      <div class="field"><label>Nuevo rol</label>
        <select id="usr-rol">
          <option value="admin">admin</option>
          <option value="gerente">gerente</option>
          <option value="empleado">empleado</option>
          <option value="cliente">cliente</option>
        </select>
      </div>
    </div>
    <div class="btn-group" style="margin-top:16px;">
      <button class="btn" id="btn-rol" onclick="cambiarRol()">Cambiar rol</button>
      <button class="btn btn-secondary" id="btn-consultar" onclick="consultarUsuario()">Consultar usuario</button>
    </div>
    <div id="usr-resultado" class="result hidden"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="section-title">
        <h2>Todas las propiedades</h2>
        <p>Vista global de hoteles registrados</p>
      </div>
    </div>
    <div class="btn-group" style="margin-bottom:18px;">
      <button class="btn" id="btn-cargar-hoteles" onclick="cargarHoteles()">Cargar hoteles</button>
      <button class="btn btn-secondary" id="btn-cargar-reservas" onclick="cargarReservas()">Cargar reservas</button>
    </div>
    <div id="admin-lista" class="card-grid"></div>
  </div>

</main>

<div class="toast" id="toast"><span id="toastMsg">Mensaje</span></div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  protegerRol(["admin"]);
  renderizarUsuario();

  function setLoading(btn, loading){
    if(loading){
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner spinner-sm"></div><span>Procesando...</span>`;
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.getAttribute('data-text') || btn.textContent;
    }
  }

  document.querySelectorAll('.btn-group button').forEach(b => {
    if(!b.getAttribute('data-text')) b.setAttribute('data-text', b.textContent);
  });

  async function cambiarRol(){
    const btn = $("btn-rol");
    setLoading(btn, true);
    const resEl = $("usr-resultado");
    resEl.classList.remove("hidden", "error", "success");
    resEl.classList.add("loading");
    try {
      const resp = await apiRequest(`/usuarios/usuarios/${$("usr-id").value}/rol`, {
        method: "PATCH",
        body: JSON.stringify({ rol: $("usr-rol").value })
      });
      mostrarResultado(resEl, resp);
    } catch(error){
      mostrarError(resEl, error.message);
    } finally {
      setLoading(btn, false);
    }
  }

  async function consultarUsuario(){
    const btn = $("btn-consultar");
    setLoading(btn, true);
    const resEl = $("usr-resultado");
    resEl.classList.remove("hidden", "error", "success");
    resEl.classList.add("loading");
    try {
      const resp = await apiRequest(`/usuarios/usuarios/${$("usr-id").value}`, { method: "GET" });
      mostrarResultado(resEl, resp);
    } catch(error){
      mostrarError(resEl, error.message);
    } finally {
      setLoading(btn, false);
    }
  }

  async function cargarHoteles(){
    const btn = $("btn-cargar-hoteles");
    setLoading(btn, true);
    const contenedor = $("admin-lista");
    contenedor.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="spinner spinner-lg"></div><span>Cargando hoteles...</span></div>`;
    try {
      const hoteles = await apiListarHoteles();
      if(hoteles.length === 0){
        contenedor.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <h3>No hay hoteles registrados</h3>
          </div>`;
        return;
      }
      contenedor.innerHTML = hoteles.map(h => `
        <div class="card">
          <div class="card-img">
            ${h.imagen_url ? `<img src="${API_BASE}${h.imagen_url}" alt="${h.nombre}" onerror="this.style.display='none'" />` : "Sin imagen"}
          </div>
          <div class="card-body">
            <div class="card-title">${h.nombre}</div>
            <div class="card-text">${h.ciudad}, ${h.pais}</div>
            <div class="card-meta">
              <span class="badge ${h.activo ? 'badge-ok' : 'badge-warn'}">${h.activo ? "Activo" : "Inactivo"}</span>
            </div>
          </div>
        </div>
      `).join("");
    } catch(error){
      contenedor.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <h3>Error al cargar</h3>
          <p>${error.message}</p>
        </div>`;
    } finally {
      setLoading(btn, false);
    }
  }

  async function cargarReservas(){
    const btn = $("btn-cargar-reservas");
    setLoading(btn, true);
    const contenedor = $("admin-lista");
    contenedor.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><div class="spinner spinner-lg"></div><span>Cargando reservas...</span></div>`;
    try {
      const reservas = await apiListarReservas();
      renderData("admin-lista", reservas, {
        setClass: false,
        emptyMessage: "No hay reservas registradas."
      });
    } catch(error){
      contenedor.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <h3>Error al cargar</h3>
          <p>${error.message}</p>
        </div>`;
    } finally {
      setLoading(btn, false);
    }
  }

  function mostrarResultado(el, datos){
    renderData(el.id, datos);
  }

  function mostrarError(el, mensaje){
    renderError(el.id, mensaje);
    mostrarToast(mensaje, "error");
  }
</script>
</body>
</html>
